services:
  # ===========================================================================
  # Frontend — Vite dev server with HMR
  # ===========================================================================
  frontend:
    container_name: mhl-frontend

    build:
      context: ./frontend

    image: frontend:myhealthlog

    entrypoint: ./entrypoint.sh

    ports:
      - 5173:5173

    env_file:
      - path: ./frontend/.env
        required: false

    volumes:
      - node_modules:/react/node_modules

    develop:
      watch:
        - path: ./frontend/package.json
          action: rebuild
        - path: ./frontend/package-lock.json
          action: rebuild
        - path: ./frontend/Dockerfile
          action: rebuild
        - path: ./frontend
          target: /react
          action: sync
          ignore:
            - node_modules/

    networks:
      - mhl_network

  # ===========================================================================
  # Nginx — reverse proxy (fronts both frontend :5173 and backend :8000)
  # ===========================================================================
  nginx:
    container_name: mhl-nginx

    restart: unless-stopped

    build:
      context: ./nginx

    image: nginx:myhealthlog

    ports:
      - 80:8080

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/include.websocket:/etc/nginx/app/include.websocket:ro
      - ./nginx/include.forwarded:/etc/nginx/app/include.forwarded:ro
      - static:/app/static
      - media:/app/media

    develop:
      watch:
        - path: ./nginx/nginx.conf
          target: /etc/nginx/conf.d/default.conf
          action: sync+restart

    depends_on:
      - frontend
      - backend

    networks:
      - mhl_network

  # ===========================================================================
  # PostgreSQL — primary data store
  # ===========================================================================
  postgresdb:
    image: postgres:17-alpine
    container_name: mhl-postgres
    restart: always
    ports:
      - 5433:5432
    environment:
      - POSTGRES_DB=${DB_NAME:-myhealthlog}
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=nakore12a
    volumes:
      - pgdata:/var/lib/postgresql/data/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mhl_network

  # ===========================================================================
  # Redis — Celery broker + response cache + Django cache backend
  # ===========================================================================
  redis:
    image: redis:7-alpine
    container_name: mhl-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mhl_network

  # ===========================================================================
  # Django backend — REST API
  # ===========================================================================
  backend:
    container_name: mhl-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: backend:myhealthlog
    # django.sh waits for postgres, runs migrate, then starts runserver.
    entrypoint: ./django.sh
    ports:
      - 8000:8000
    env_file:
      - ./backend/.env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.local
      # Nginx streams private health files from its internal /protected-media/.
      - FILE_X_ACCEL_PREFIX=/protected-media/
    volumes:
      - ./backend:/app
      - static:/app/staticfiles
      - media:/app/mediafiles
      # Persist logs across restarts
      - backend_logs:/app/logs
    depends_on:
      postgresdb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mhl_network
    develop:
      watch:
        - path: ./backend/requirements/local.txt
          action: rebuild
        - path: ./backend/requirements/base.txt
          action: rebuild
        - path: ./backend/Dockerfile
          action: rebuild
        - path: ./backend
          target: /app
          action: sync
          ignore:
            - __pycache__/
            - "*.pyc"
            - .pytest_cache/
            - logs/

  # ===========================================================================
  # Celery worker — processes background tasks (AI extraction, emails, etc.)
  # ===========================================================================
  celery_worker:
    container_name: mhl-celery-worker
    restart: unless-stopped
    # Same image as the backend, so the worker always runs the same code and
    # dependencies (a separately built image went stale and drifted).
    image: backend:myhealthlog
    # init reaps the prefork children; without it a killed child can leave the
    # worker unable to shut down cleanly.
    init: true
    command: celery -A config worker -l info --concurrency=2 --max-tasks-per-child=50
    env_file:
      - ./backend/.env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.local
      - C_FORCE_ROOT=1
    volumes:
      - ./backend:/app
      - media:/app/mediafiles
      - backend_logs:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$HOSTNAME -t 10 | grep -q pong"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 30s
    develop:
      watch:
        - path: ./backend/apps
          target: /app/apps
          action: sync+restart
          ignore:
            - "**/__pycache__/"
            - "**/tests/"
    depends_on:
      backend:
        condition: service_started
      postgresdb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mhl_network

  # ===========================================================================
  # Celery Beat — periodic task scheduler
  # ===========================================================================
  celery_beat:
    container_name: mhl-celery-beat
    restart: unless-stopped
    init: true
    image: backend:myhealthlog
    command: celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    env_file:
      - ./backend/.env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.local
      - C_FORCE_ROOT=1
    volumes:
      - ./backend:/app
      - backend_logs:/app/logs
    depends_on:
      backend:
        condition: service_started
      postgresdb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mhl_network

volumes:
  node_modules:
  pgdata:
  static:
  media:
  backend_logs:

networks:
  mhl_network:
    driver: bridge
