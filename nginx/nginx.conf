# =============================================================================
# myHealthLog reverse proxy
#
# Nginx sits in front of both the Vite dev server (frontend:5173) and the
# Django REST API (backend:8000).  All API and admin traffic is routed to
# the Django backend; everything else goes to the React frontend.
# =============================================================================

upstream api {
    server backend:8000;
}

upstream react {
    server frontend:5173;
}

server {
    listen 8080;

    client_max_body_size 20M;

    # -------------------------------------------------------------------------
    # Backend — Django REST API, admin, and schema docs
    # -------------------------------------------------------------------------
    location ~ ^/(admin|api|__debug__)/ {
        proxy_pass http://api;
        proxy_redirect off;
        # AI answers (Copilot, summaries) can take longer than the 60s default.
        proxy_read_timeout 180s;
        include /etc/nginx/app/include.websocket;
        include /etc/nginx/app/include.forwarded;
    }

    # -------------------------------------------------------------------------
    # Collected static files served directly by Nginx (Django collectstatic)
    # -------------------------------------------------------------------------
    location /static/ {
        alias /app/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # -------------------------------------------------------------------------
    # Uploaded files
    #
    # Health documents are private: they are only reachable through Django's
    # signed /api/v1/records/files/<token>/ view, which checks the token and then
    # hands the transfer to the internal location below (X-Accel-Redirect).
    # Only profile photos are public.
    # -------------------------------------------------------------------------
    location /media/profile_photos/ {
        alias /app/media/profile_photos/;
        add_header Cache-Control "private, no-store";
    }

    location /media/ {
        return 404;
    }

    location /protected-media/ {
        internal;
        alias /app/media/;
        add_header Cache-Control "private, no-store";
        add_header X-Content-Type-Options "nosniff";
    }

    # -------------------------------------------------------------------------
    # Frontend — Vite dev server with HMR websocket pass-through
    # -------------------------------------------------------------------------
    location / {
        proxy_pass http://react;
        include /etc/nginx/app/include.websocket;
        include /etc/nginx/app/include.forwarded;
    }
}
