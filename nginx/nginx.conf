# -----------------------------------------------------------------------------
# myHealthLog reverse proxy.
# For now it only fronts the frontend. The backend blocks below are commented
# because nginx refuses to start if it can't resolve an upstream host, and the
# `backend` service does not exist yet. Uncomment them when the backend lands.
# -----------------------------------------------------------------------------

# upstream api {
#     server backend:8000;
# }

upstream react {
    server frontend:5173;
}

server {
    listen 8080;

    # Frontend. The websocket include lets Vite's HMR socket pass through when
    # the app is opened via nginx (http://localhost) instead of :5173 directly.
    location / {
        proxy_pass http://react;
        include /etc/nginx/app/include.websocket;
        include /etc/nginx/app/include.forwarded;
    }

    # ===== Backend (uncomment together with the `api` upstream above) =========
    #
    # location ~ ^/(admin|api|ws) {
    #     proxy_pass http://api;
    #     proxy_redirect default;
    #     include /etc/nginx/app/include.websocket;
    #     include /etc/nginx/app/include.forwarded;
    # }
    #
    # location /static/ {
    #     alias /app/static/;
    # }
    #
    # location /media/ {
    #     alias /app/media/;
    # }
}
