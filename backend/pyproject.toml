[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py", "*_test.py"]
testpaths = ["apps"]
addopts = [
    # The dev container exports DJANGO_SETTINGS_MODULE=config.settings.local,
    # and an env var wins over the ini setting above. --ds takes priority over
    # both, so `pytest` inside the container still uses the test settings
    # (SQLite, no debug toolbar) instead of the running dev server's.
    "--ds=config.settings.test",
    "--strict-markers",
    "--strict-config",
    "--cov=apps",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
    "--cov-fail-under=70",
]
markers = [
    "slow: slow tests",
    "integration: integration tests requiring external services",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["apps", "config"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "S",   # flake8-bandit (security)
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]
ignore = [
    "E501",   # line length — handled by formatter
    "RUF012", # mutable class attributes — Django uses these everywhere (Meta, permission_classes, etc.)
    "S105",   # hardcoded password string — false positive for constant labels like AUTH_METHOD_PASSWORD
]

[tool.ruff.lint.per-file-ignores]
"**/migrations/*.py" = ["E501", "RUF012"]
"**/tests/*.py" = ["S101", "S106"]  # allow assert + test passwords in tests
"**/settings/*.py" = ["F405", "F403", "S104", "S108"]  # star imports + dev bindings intentional
"**/admin.py" = ["F401"]  # Django admin imports register models

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
strict = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = ["migrations/", "venv/"]

[tool.django-stubs]
django_settings_module = "config.settings.local"
